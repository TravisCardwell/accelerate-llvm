snapshot: lts-21.25

packages:
  - accelerate-llvm
  - accelerate-llvm-native
  - accelerate-llvm-ptx

  # Adjust the following to install tracy-capture (Tracy CLI program) and/or
  # tracy-profiler (Tracy GUI program), referencing a local copy of the Stack
  # packages from <https://github.com/AccelerateHS/accelerate-tracy>, adjusting
  # paths if necessary.

  #- ../accelerate-tracy/accelerate-tracy-capture-stack
  #- ../accelerate-tracy/accelerate-tracy-profiler-stack

extra-deps:

  # accelerate
  - bytestring-encoding-0.1.2.0
  - hashtables-1.4.2
  - MIP-0.2.0.1
  - OptDir-0.1.0

  # accelerate-llvm
  - monadLib-3.10.3

  # accelerate-llvm-ptx
  - cuda-0.13.0.0

  # newer versions required to parse modern CUDA headers
  - c2hs-0.28.8@rev:3
  - language-c-0.10.2

  # Comment out the following when developing the Tracy packages locally.

  - git: https://github.com/AccelerateHS/accelerate-tracy.git
    commit: '18cc4cd3a1067b24d0f391922158c7dfa8b0e3c4'
    subdirs:
      - accelerate-tracy-lib
      - accelerate-tracy-capture
      - accelerate-tracy-profiler

  # Uncomment the following when developing the Tracy packages locally,
  # adjusting paths if necessary.

  #- ../accelerate-tracy/accelerate-tracy-lib
  #- ../accelerate-tracy/accelerate-tracy-capture
  #- ../accelerate-tracy/accelerate-tracy-profiler

  # Comment out the following when developing the accelerate package locally.

  - git: https://github.com/ivogabe/accelerate.git
    commit: '90b9a5e78ff71879b9263306d96279168becd380'

  # Uncomment the following when developing the accelerate package locally,
  # adjusting paths if necessary.

  #- ../accelerate

# Adjust the following configuration to enable flags.

#flags:
  #accelerate-tracy-lib:
    #tracy: true
  #accelerate:
    #debug: true
    #bounds-checks: true
    #memory-counter: true
    #internal-checks: true
